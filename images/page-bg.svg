<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <radialGradient id="grad">
        <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="20%" cy="20%" r="400" fill="url(#grad)">
      <animate attributeName="cx" values="20%;25%;20%" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="20%;15%;20%" dur="25s" repeatCount="indefinite" />
  </circle>
  <circle cx="80%" cy="80%" r="500" fill="url(#grad)">
      <animate attributeName="cx" values="80%;75%;80%" dur="22s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80%;85%;80%" dur="27s" repeatCount="indefinite" />
  </circle>
</svg>
